[workspace]
members = [
    "raw",
    "api",
    "apps",
    "config",
]

resolver = "3"
    # virtual workspace TOML (that's us) needs this explicitly for parsing guidance (same as release 2024 in the members)

[workspace.dependencies]
ezb-node = { path = "api" }
ezb-node-raw = { path = "raw" }
ezb-node-config = { path = "config", default-features = false }

embassy-time = { version = "0.5.1", features = ["log"] }

embuild = { version = "0.33", features = ["espidf"] }

# Take all 'esp-idf-{hal|sys|svc}' (and 'embuild') from the workspace level: they are inter-related.
#
# Note: sub-projects cannot use 'default-features =false', unless we use it here, as well.
#       This means someone *wanting* defaults needs to declare 'default-features = true'. It's ok.
#
esp-idf-hal = { version = "0.47", default-features = false }
esp-idf-svc = { version = "0.53", default-features = false }
esp-idf-sys = { version = "0.38", default-features = false }

log = { version = "0.4" }

# Referenced in subprojects by:
#   <<
#       [lints]
#       workspace = true
#   <<
[workspace.lints.rust]
rust_2018_idioms = "warn"   # sample

[profile.release]
# intention: more info in case of stack dumps
debug = true
strip = false
opt-level = "s"

