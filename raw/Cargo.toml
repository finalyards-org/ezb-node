[package]
name = "ezb-node-raw"
    # name used in 'api' and the 'ESP_IDF_SYS_ROOT_CRATE' env.var. ('.cargo/config.toml')
edition = "2024"
rust-version = "1.94"
publish = false

# The '[package.metadata.esp-idf-sys]' needs to be within the Cargo crate designated as 'ESP_IDF_SYS_ROOT_CRATE'.
#
#   Note: Please reflect any changes also in '{project}/_mc/main/idf_component.yml'
#
[package.metadata.esp-idf-sys]
esp_idf_component_manager = "y"
    # "on/y by default, but good practice to explicitly state"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp-zigbee-lib", version = "2.0.3" }

[dependencies]
log.workspace = true

esp-idf-sys = { workspace = true, default-features = false, features = ["native"] }
    # "native": recommended by 'google.ai', to make sure linking external components succeeds. tbd. try without, #later
    #
    # Carries ESP-IDF headers, libraries, and pulls in 'esp-zigbee-lib' headers.
    # Needs to be under '[dependencies]' since it carries libraries that end up in the product.

strum = { version = "0.28", features = ["derive"] }
    # allows '::from_repr()' on enum types

[features]
default = []

# ESP32 devices with Zigbee support (currently targeting only C6).
# tbd. Can we drive 'esp-idf-sys' and the ESP-IDF toolchain with this, i.e. choose MCU from above?
esp32c6 = []

# ZCL clusters |1| _may_be_ presented as features. This helps you clearly see, which clusters are implemented.
#
#   |1|: https://docs.espressif.com/projects/esp-zigbee-sdk/en/latest/esp32c6/introduction.html#zcl-clusters
#   |2|: https://docs.espressif.com/projects/esp-zigbee-sdk/en/latest/esp32c6/introduction.html#ha-automation-device-types
#
# However, the use of features is NOT INTENDED FOR EXTERNAL USE. Only 'api' is steered by features.
# See 'DESIGN.md'.
#
