[package]
name = "esp-zb-raw"
    # name used in 'examples' and the 'main' project
edition = "2024"
rust-version = "1.92"
publish = false

# Complements the env.vars in '.cargo/config.toml'. Implementation specific parts of 'esp-idf-sys' config are here.
[package.metadata.esp-idf-sys]
#esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]
  # ^-- builds, uses '{target}/riscv32imac-esp-espidf/release/build/esp-idf-sys-853a2667a8c024cb/out/gen-sdkconfig.defaults'
esp_idf_sdkconfig_defaults = ["raw/sdkconfig.defaults"]

# Note: 'esp_idf_components' is not the same as using 'sdkconfig.defaults' (according to Copilot).
#   - 'sdkconfig.defaults' "steers ESP-IDF *internal* components"
#   - 'esp_idf_components' is for *external* ESP-IDF components (one's own code)
#
#esp_idf_components = ["pthread"]
esp_idf_components = []

[dependencies]
esp-idf-sys = { version = "0.37.2" }
log = "0.4"

# --- Optional Embassy Integration ---
# esp-idf-svc = { version = "0.51", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }

# If you enable embassy-time-driver, you MUST also add one of:

# a) Standalone Embassy libs ( embassy-time, embassy-sync etc.) with a foreign async runtime:
# embassy-time = { version = "0.4.0", features = ["generic-queue-8"] } # NOTE: any generic-queue variant will work

# b) With embassy-executor:
# embassy-executor = { version = "0.7", features = ["executor-thread", "arch-std"] }

# NOTE: if you use embassy-time with embassy-executor you don't need the generic-queue-8 feature

# --- Temporary workaround for embassy-executor < 0.8 ---
# esp-idf-svc = { version = "0.51", features = ["embassy-time-driver", "embassy-sync"] }
# critical-section = { version = "1.1", features = ["std"], default-features = false }

#defmt           = { version = "1.0.1", optional = true }

#[dev-dependencies]
# Rust provides no mechanism for conditional 'dev-dependencies'. Thus, we introduce them here. THIS IS UNFORTUNATE:
# it does make these part of the package's external interface (doesn't it?); any better way is welcome. #rust
#
# We could make wholly separate packages ('vl_uld_println' etc.) but that's too complex.
#
#defmt-rtt       = { version = "1.0.0", optional = true }

[build-dependencies]
embuild = { version = "0.33.1", features = ["espidf"] }

# ZCL clusters |1| are presented as features. This helps you clearly see, which clusters are implemented.
#
# (The same will likely apply to "HA Automation Device Types" |2| as well.)
#
#   |1|: https://docs.espressif.com/projects/esp-zigbee-sdk/en/latest/esp32c6/introduction.html#zcl-clusters
#   |2|: https://docs.espressif.com/projects/esp-zigbee-sdk/en/latest/esp32c6/introduction.html#ha-automation-device-types
#
[features]
default = [
    "zcl_basic",
    "zcl_identify",
]

# Supported Zigbee clusters; based on 'esp_zigbee_attribute.h':
zcl_basic = []
zcl_identify = []
zcl_groups = []
zcl_scenes = []
zcl_on_off = []
zcl_on_off_switch_config = []
zcl_level = []
zcl_color_control = []
zcl_time = []
zcl_binary_input = []
zcl_comissioning = []
zcl_shade_config = []
zcl_door_lock = []
zcl_ias_zone = []
zcl_ias_wd = []
zcl_temperature_meas = []
zcl_humidity_meas = []
zcl_ota = []
zcl_illuminance_meas = []
zcl_pressure_meas = []
zcl_flow_meas = []
zcl_electrical_meas = []
zcl_window_covering = []
zcl_occupancy_sensing = []
zcl_thermostat = []
zcl_fan_control = []
zcl_thermostat_ui_config = []
zcl_analog_input = []
zcl_analog_output = []
zcl_binary_output = []
zcl_analog_value = []
zcl_ec_measurement = []
zcl_ph_measurement = []
zcl_wind_speed_measurement = []
zcl_carbon_dioxide_measurement = []
zcl_pm2_5_measurement = []
zcl_multistate_input = []
zcl_multistate_output = []
zcl_multistate_value = []
zcl_diagnostics = []
zcl_meter_identification = []
zcl_drlc = []
zcl_dehumidification = []
zcl_binary_value = []
zcl_poll_control = []
zcl_device_temp_config = []
zcl_alarms = []

custom_cluster = []

# ESP32 devices with Zigbee support (currently targeting only C6).
# tbd. Can we drive 'esp-idf-sys' and the ESP-IDF toolchain with this, i.e. choose MCU from above?
esp32c6 = []

