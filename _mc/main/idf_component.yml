# idf_component.yml
#
# Causes 'menuconfig' to activate the same external components as in Rust build.
#
# NOTE:
#   Keep this aligned with '{project folder}/raw/Cargo.toml':
#   <<
#     [[package.metadata.esp-idf-sys.extra_components]]
#     remote_component = { name = "espressif/esp-zigbee-lib", version = "2.*" }
#   <<
#
# References:
#   - 'idf_component.yml' Manifest File (Espressif docs)
#     -> https://docs.espressif.com/projects/idf-component-manager/en/latest/reference/manifest_file.html
#
targets:
  - esp32c6

dependencies:
  espressif/esp-zigbee-lib: "2.*"
  idf: ">=5.5"
