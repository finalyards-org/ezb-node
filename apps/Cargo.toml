[package]
name = "ezb-node-apps"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
publish = false

# Inform 'espflash'
#
# We are anyways pointing the flashing command ('espflash') directly at the partition table, so keeping this hidden,
# to avoid confusion. 3-May-26
#
[package.metadata.espflash]
partition_table = "partitions.csv"

[dependencies]
ezb-node = { path = "../api", features = [] }   # "coordinator", "router"

log.workspace = true

# 'esp-idf-svc' is *vital for Embassy integration*
#   - 'embassy_time_driver' comes through there, which is essential in tying ESP-IDF and Embassy together.
#   - 'alloc' is needed for logging
#
esp-idf-svc = { version = "0.52.1", features = ["embassy-time-driver", "alloc", "binstart"], default-features = false }
    #
    # Note: Do not hesitate bringing 'std' in, if there are problems. The above is merely the *slimmest*
    #       setup the author thinks will work. There may be unnoticed side effects in not bringing full 'std'.

embassy-executor = { version = "0.10", features = ["executor-thread", "platform-std"] }
embassy-futures = { version = "0.1.2" }
embassy-sync     = { version = "0.8.0" }
embassy-time    = { workspace = true, features = ["generic-queue-8"] }
    # generic-queue-X: 'esp-idf-template' comments: "any 'generic-queue' implementation will work"

[build-dependencies]
anyhow = { version = "1.0" }

embuild.workspace = true

ezb-node-config = { path = "../config", features = ["toml"] }

[features]
default = ["esp32c6", "_coordinator", "_router", "_eps"]

esp32c6 = [
    "ezb-node/esp32c6",
]

# Note: By defining the creation features like this, we get them in one place.
_coordinator = ["ezb-node-config/coordinator", "ezb-node/coordinator"]
_router = ["ezb-node-config/router", "ezb-node/router"]

_eps = ["ezb-node/ep_color_dimmable_light"]

[lints]
workspace = true

[[bin]]
name = "light"
path = "bin/light/main.rs"
required-features = ["esp32c6", "ezb-node/ep_color_dimmable_light"]
