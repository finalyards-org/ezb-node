[network]
primary_channels = [13]
#secondary_channels = [..]  # default: all channels (11..=26)

[platform]
storage_partition_name = "zb_storage"

[node]
type = "coordinator"
install_code_policy = false
max_children = 10

[endpoint.defaults]
manufacturer_name = "Your name"
model_identifier = "Your model"

[endpoint.10]
device_type = "color_dimmable_light"
