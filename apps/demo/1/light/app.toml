#
# Setup for the Zigbee node.
#
[network]
primary_channels = [13]
secondary_channels = "all"

[platform]

[node]
type = "coordinator"
allow_open_pairing = true
max_children = 10

[endpoint.defaults]
manufacturer_name = "Your name"
model_identifier = "Your model"

[endpoint.10]
device_type = "color_dimmable_light"
