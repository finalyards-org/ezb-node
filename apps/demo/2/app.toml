#
# Coordinator to listen to a Door/Window sensor.
#
# Provides:
#   - "ias_cie" HA profile
#       - "ias_zone" (client role)
#   - "power_config" (client role)
#
[network]
primary_channels = [11, 15, 20, 25]     # 11, 15, 20 or 25 are best for catching external devices
secondary_channels = "all"

[platform]

[node]
type = "coordinator"
allow_open_pairing = true
    # allow pairing with well known keys
max_children = 5

[endpoint.defaults]
manufacturer_name = "Espressif"
model_identifier = "ESP32-C6 gateway"

[endpoint.1]
device_type = "HA::ias_cie"
    # HA = "Home Automation"
    # IAS = "Intrusion Alarm System"
    # CIE = "Control and Indicating Equipment"

additional_client_clusters = [
    "HA::power_config"      # remaining battery
]

[[node.pre_configured_device]]
log_name = "Sample door/window sensor"
mac_address = "4030 59FF FE9E 7D3D"
install_code = "964B B40A 0684 F31D 3181 8DFD 0525 4897 337E"
