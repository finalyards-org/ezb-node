[package]
name = "esp-zb"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"

[dependencies]
esp-zb-raw = { path = "../raw" }

log.workspace = true

esp-idf-sys = { workspace = true, default-features = false }
    # just core

[dev-dependencies]
anyhow = { version = "1.0", default-features = false }
esp-idf-sys = { workspace = true, features = ["alloc_handler", "binstart"], default-features = false }
    # just core; we do our own panic handler

esp-idf-hal = { version = "0.46.2", features = ["alloc"], default-features = false }
    # hardware access

embassy-executor = { version = "0.10.0", features = ["embassy-time-driver", "platform-spin", "task-arena-size-12288"] }
#embassy-futures = { version = "0.1.2" }
#embassy-sync    = { version = "0.7.2" }
embassy-time    = { version = "0.5.0", features = ["log"] }

[build-dependencies]
embuild.workspace = true

[features]
default = ["esp32c6","embassy"]

embassy = [

]

esp32c6 = [
    "esp-zb-raw/esp32c6",
]

[lints]
workspace = true

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[[example]]
name = "a"
required-features = ["esp32c6", "embassy"]

[[example]]
name = "light"
required-features = ["esp32c6", "embassy"]
