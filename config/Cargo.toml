[package]
name = "ezb-node-config"
version = "0.0.2"
edition = "2024"
rust-version = "1.94"

[dependencies]
humantime-serde = { version = "1.1", optional = true }
quote = { version = "1.0", optional = true }
prettyplease = { version = "0.3", optional = true }
proc-macro2 = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive", "alloc"], default-features = false, optional = true }
syn = { version = "3.0", features = ["full"], optional = true }
toml = { version = "1.1.6", features = ["serde"], optional = true }

itertools = { version = "0.15", optional = true }

log = { workspace = true }

# The library has two faces:
#   - used from build.rs (feature = "gen")
#       - generates a source module from the TOML
#       - MORE THAN ONE node types CAN BE ENABLED at once. THIS IS VITAL for the "apps" crate's demos, where demos
#         represent different node types. For such a crate, all TOML -> code generation happens WITHIN THE SAME 'build.rs'
#         run. Thus, it becomes a hard requirement to either not do node type features at all, or to allow multiple. :)
#       - target: host
#   - used from an application:
#       - only ONE of the node types is to be enabled
#       - used by the code that got generated in the build
#       - target: esp32-c6
#
# NOTE: This could be done in many ways. The author has attempted to balance between ability to express things build-
#       time (i.e. to use features), which has documentary advantages, and simplicity overall.
#
[features]
# Default: all node types, all device types.
#   The defaults are _only applied for "gen" builds_. For applications, the application should specifically define
#   its needs (and 'api' level runs defaults off).
#
default = ["coordinator", "router", "_all_dts"]

# When using from 'build.rs'.
#
# Note: We enable all node types, all device types. The
#
gen = [
    "humantime-serde", "quote", "prettyplease", "proc-macro2", "serde", "syn", "toml", "itertools",
]

# These for using in the application code.
coordinator = []
router = []
#end_device_UNTESTED = []

# --- Device types

# Use by './Justfile', 'build.rs'
_all_dts = ["dt_color_dimmable_light", "dt_color_dimmer_switch", "dt_ias_cie"]
_any_dt = []
    # enabled if any device type is enabled (used by 'build.rs')

# implements SERVER side of (clusters):
#   HA::on_off
#   HA::level_control
#   HA::color_control
dt_color_dimmable_light = ["_any_dt"]

# implements CLIENT side of (clusters):
#   HA::on_off
#   HA::level_control
#   HA::color_control
dt_color_dimmer_switch = ["_any_dt"]

# implements SERVER side of (clusters):
#   HA::ias_zone    // receives Door/Window/Movement alert information
dt_ias_cie = ["_any_dt"]

# --- Additional ZCL profiles (all HA)
#
# CURRENTLY INACTIVE. Let's just bring in the code we need; see #later if we want to feature-gate them.
#
#cl_power_config = []  # HA::power_config (server); collects battery information

[lints]
workspace = true
