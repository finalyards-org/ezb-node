#
# /.cargo/config.espidf.toml
#
# This is a repo specific workaround for 'cargo' not allowing to stop the '.cargo/config.toml' cascade.
#
# The problem we fix:
#   - insulating 'config' (which is not part of the larger workspace, and does not need esp-idf) from getting
#     these changes, *while* keeping its folder in the same level as other (which are part of the workspace)
#     sub-projects.
#
# How we fix it:
#   - This file has another name ('config.espidf.toml'); we symbolically link to it from the ESP32-specific workspace
#     folders, allowing us to distribute settings, without duplicating them.
#
[build]
target = "riscv32imac-esp-espidf"

# Instructions on what kind of library to build for the target.
#   - 'ldproxy' requires "std" even if our application were to use 'esp-idf-sys' only (in 'no_std')
#   - use of Embassy + FreeRTOS is dependent on 'embassy_time_driver', which... needs 'esp-idf-svc', and thus we are
#     firmly in the "std" land.
#   - panic type does not really matter: we catch it with a hook anyways to avoid a reset-loop
#
[unstable]
build-std = ["std", "panic_abort"]

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv"
    #
    # Note: You can try to get faster flash speed by:
    #   '--flash-freq 80mhz' (default is 40MHz); did not cause a speed-up with the author.
    #   '--flash-mode qio' (default is DIO); did not work for the author.
    #
    #   Such settings (if they work for you) can be placed in '.config/espflash/espflash.toml'

rustflags = [
    # "Required to obtain backtraces [on RISC-V only], however it may negatively impact the performance of your application."
    #
    # "Please note that when targeting a RISC-V device, you need to force frame pointers (i.e. "-C", "force-frame-pointers",
    # in your .cargo/config.toml); this is not required for Xtensa."
    #
    # Note: Interesting discussion in:
    #   - "`force-frame-pointers` flag isn't honored always unless std is recompiled as such"
    #       -> https://github.com/rust-lang/rust/issues/103711 (GitHub Issues; [closed])
    #
    # We... might not need this.
    #"-C", "force-frame-pointers",

    # "must be set for ESP-IDF 5.0 and above" |1|
    #
    # Time was 32bit in ESP-IDF 4.x and will be 64bit from now on.
    # |1|: https://github.com/esp-rs/esp-idf-sys/blob/master/BUILD-OPTIONS.md#rust-configuration-flags
    #
    "--cfg", "espidf_time64",
]

# Note: Build environment does not get inherited in Cargo. To have the same settings for both 'raw' and 'api', we
#       provide them here. You can make local overrides in either.
#
[env]
MCU = "esp32c6"
# ESP-IDF releases, see -> https://github.com/espressif/esp-idf/releases
#ESP_IDF_VERSION = "6.0.2"      # latest, see #10
ESP_IDF_VERSION = "5.5.5"   # compatible with 'git' URLs + one patch /13-Aug-26
#ESP_IDF_VERSION = "5.5.4"   # fully compatible

ESP_IDF_TOOLS_INSTALL_DIR = "global"
    # "out":        '{cargo output}/espressif'
    # "global":     '~/.espressif'; needs 'ldproxy'

#---
# ESP-IDF steering
#
# NOTE:
#   'relative' path definitions are relative to the project workspace root |1| (not the working directory).
#       |1|: https://github.com/esp-rs/esp-idf-sys/blob/master/BUILD-OPTIONS.md#esp_idf_sdkconfig_defaults-esp_idf_sdkconfig_defaults
#
#       ‼️‼️THIS IS NOT TRUE !!!
#
#       In observed reality, these lines, when built under the 'apps' folder:
#       <<
#           ESP_IDF_SDKCONFIG = { value = "sdkconfig", relative = true }
#           ESP_IDF_SDKCONFIG_DEFAULTS = { value = "raw/sdkconfig.defaults", relative = true }
#       <<
#       ..cause such paths in the build output:
#       <<
#           [esp-idf-sys 0.37.2]     esp_idf_sdkconfig: Some(
#           [esp-idf-sys 0.37.2]         "/home/ubuntu/ezb-node/apps/sdkconfig",
#           [esp-idf-sys 0.37.2]     ),
#           [esp-idf-sys 0.37.2]     esp_idf_sdkconfig_defaults: Some(
#           [esp-idf-sys 0.37.2]         [
#           [esp-idf-sys 0.37.2]             "/home/ubuntu/ezb-node/apps/raw/sdkconfig.defaults",
#           [esp-idf-sys 0.37.2]         ],
#           [esp-idf-sys 0.37.2]     ),
#       <<
#
#       FIX:
#           Since *any* build folder (raw|api|apps) can refer to us, we take "one step up" (..) and then
#           dive back in.
#
#       IT WOULD ALSO HELP TREMENDOUSLY if 'esp-idf-sys' terminated a build, if there's a non-existing
#       path for either 'sdkconfig' or 'sdkconfig.defaults'. Why not?

# Tells 'esp-idf-sys' where the "root" of the C/CMake project is (this project does not really need one, unless we
# start shipping C objects).
#
# Earlier comment:
#   >IMPORTANT so that the configurations in 'sdkconfig.defaults' regarding that component get applied.
#
ESP_IDF_PROJECT_DIR = { value = ".", relative = true }

# ESP_IDF_SDKCONFIG
#
# This is a bit fuzzy. The default is said to be 'sdkconfig' (presumably in the folder where the build originated?)
# but if we leave this out, the build configuration shows 'None', and things will work.
#
# No entry:
#   - build works
#   - 'sdkconfig' gets generated in:
#       /home/ubuntu/target/riscv32imac-esp-espidf/release/build/esp-idf-sys-{..hash..}/out/sdkconfig
#   - things work
ESP_IDF_SDKCONFIG = { value = "../sdkconfig", relative = true }

# Trick: Use '../' to work equally well in 'raw', 'api', 'apps'. !! Since the file contains things like stack size,
# it is regarded belonging to the application's custody.
#
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "../apps/sdkconfig.defaults", relative = true }

# The name of the crate that has '[[package.metadata.esp-idf-sys.extra_components]]' section, listing:
#   - esp_zigbee_lib
#
# The content is the name of the crate, _not_ a folder name!
#
# NOTE! If this is out of sync, the 'raw' build will break but not in any decent, helpful manner!  You will see this
#       warning somewhere in the output:
#           <<
#               [esp-idf-sys 0.37.2] cargo:warning=the crate given by `ESP_IDF_SYS_ROOT_CRATE` does not exist in this workspace
#           <<
#
#       The best way is to check the output JSON starting "Build configuration: BuildConfig {", every now and then.
#       If things work, you did get this right! ⛱️☀️
#
# Note 2: The _real_ error you'll get if this is wrong is:
#       <<
#           $ make manual
#           Makefile:68: *** No 'managed_components' pulled by Rust build.  Stop.
#       <<
ESP_IDF_SYS_ROOT_CRATE = "ezb-node-raw"

#---
# Have this if you use Multipass VM, and a global 'target' folder.
CARGO_WORKSPACE_DIR = { value = "", relative = true }
    #
    # "[...] you have set 'CARGO_TARGET_DIR' and moved your target directory out of the crate root, then
    #   embuild is not able to locate the crate root. This will result in it among other things ignoring
    #   your local sdkconfig.defaults. In this case you must declare: [...]
    #     -> https://github.com/esp-rs/esp-idf-sys/blob/master/BUILD-OPTIONS.md#esp-idf-configuration

# Suppress some 'esp-idf-sys' warnings:
#   <<
#       [esp-idf-sys 0.37.2] clang diag: /home/ubuntu/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/esp-idf-sys-0.37.2/src/include/esp-idf/bindings.h:383:5: warning: macro expansion producing 'defined' has undefined behavior [-Wexpansion-to-defined]
#   <<
BINDGEN_EXTRA_CLANG_ARGS="-Wno-expansion-to-defined"

#---
# Trim down the set of components (~1050 -> ~930). OPTIONAL, but reduces the build time.
#
# List of 'esp-idf-sys' default components:
#   <<
#       $ find ~/target -name project_description.json
#       $ cat {above} | jq common_component_reqs -C
#   <<
#
# google.ai claims:
#   <<
#       Because ESP-IDF's CMake system is built in a way that esp-idf-sys only picks up the components listed in
#       'ESP_IDF_COMPONENTS', it cuts the chain of transitive dependencies from the Rust side of things.
#       That is, even if C side (esp-zigbee-lib) asks for "openthread", esp-idf-sys won't take it in, unless
#       it's _also_ on the Rust whitelist.
#   <<
#
ESP_IDF_COMPONENTS = """\
  cxx;newlib;freertos;esp_hw_support;heap;log;soc;hal;esp_rom;esp_common;esp_system;riscv;main;driver;\
  vfs;nvs_flash;wear_levelling;fatfs;spiffs;\
"""
    # vfs, nvs_flash:
    #   - 'color_dimmable_light' C sample has them as 'PRIV_REQUIRES'; needed
    #
    # fatfs:    'esp-idf-svc-0.52.1' needs it
    #   <<
    #       error[E0433]: cannot find `fatfs` in `fs`
    #       --> /home/ubuntu/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/esp-idf-svc-0.52.1/src/io.rs:126:51
    #       |
    #       126 |             T: core::borrow::BorrowMut<crate::fs::fatfs::Fatfs<H>>,
    #       |                                                   ^^^^^ could not find `fatfs` in `fs`
    #       |
    #   <<
    #
    # spiffs:   'esp-idf-svc-0.52.1' needs it
    #   <<
    #       error[E0433]: cannot find `spiffs` in `fs`
    #       --> /home/ubuntu/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/esp-idf-svc-0.52.1/src/io.rs:80:51
    #       |
    #       80 |             T: core::borrow::BorrowMut<crate::fs::spiffs::Spiffs>,
    #       |                                                   ^^^^^^ could not find `spiffs` in `fs`
    #       |
    #   <<
