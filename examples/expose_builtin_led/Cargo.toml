[package]
name = "esp_zb_expose_builtin_led"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
#esp-hal         = { version = "1.0.0"  , features = ["requires-unstable"], default-features = false }  # "defmt", "esp32c[36]"
esp-hal         = { version = "1.0.0"  , features = ["unstable"] }  # "defmt", "esp32[c6]"

#esp-bootloader-esp-idf = "0.4.0"
#esp-backtrace = { version = "0.18.1", features = [ "panic-handler", "println" ] }
#esp-hal = { version = "1.0.0", features = ["unstable"] }
#esp-alloc = { version = "0.9.0" }
#esp-println = { version = "0.16.1", features = ["log-04"] }
#esp-radio = { version = "0.17.0", features = ["ble", "log-04", "unstable"] }
#esp-rtos = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }

esp-zb      = { path = "../main", features = [] }     # "defmt"

defmt           = { version = "1.0", optional = true }

[dev-dependencies]
defmt-rtt       = { version = "1.0" }

embassy-executor = { version = "0.7.0", features = ["task-arena-size-12288"] }
embassy-futures = { version = "0.1.2" }
embassy-sync    = { version = "0.7.2" }
embassy-time    = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }

esp-backtrace   = { version = "0.17.0", features = ["panic-handler", "defmt", "esp32c6", "semihosting"] }
esp-hal         = { version = "1.0.0-rc.0"  , features = ["esp32c6", "unstable"] }  # "defmt"
# "unstable" required by 'esp-hal-embassy'; 'esp_hal::delay::Delay'
esp-hal-embassy = { version = "0.9.0", features = ["defmt", "esp32c6"] }

semihosting     = {  version = "0.1.20" }
#R static_cell     = { version = "2.1.1" }

[features]
default = ["esp32c6"]

defmt = ["dep:defmt", "esp-zb-raw/defmt", "esp-hal/defmt"]

esp32c6 = ["esp-hal/esp32c6"]

# Enable to use latest 'main' (also enable 'esp-hal-next' feature, if fails to build, otherwise)
#|[patch.crates-io]
#|esp-alloc       = { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-backtrace   = { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-hal         = { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-hal-embassy = { git = "https://github.com/esp-rs/esp-hal.git" }
#|esp-println     = { git = "https://github.com/esp-rs/esp-hal.git" }

#---
# 'esp-hal' recommends only using 'release'. The settings reflect those of the 'esp-hal' project's own examples:
#   -> https://github.com/esp-rs/esp-hal/blob/d75e5f919a0295952bc8e9e78bf0813f4d0384a9/examples/wifi/embassy_sntp/Cargo.toml#L80
#
#   Defaults: https://doc.rust-lang.org/cargo/reference/profiles.html?highlight=incremental#release
#
[profile.release]
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1
