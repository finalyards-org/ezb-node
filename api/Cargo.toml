[package]
name = "ezb-node"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"

[dependencies]
ezb-node-raw = { path = "../raw" }
ezb-node-config = { path = "../config" }

log.workspace = true

embassy-sync = { version = "0.8.0", features = ["std"] }    # "std": thread mode

# 'esp-idf-svc' is vital for:
#   - 'std' for RTOS threading (running Zigbee task separate from the application task)
#   + 'native' (from workspace) needed for linking (likely; tbd. confirm)
#
esp-idf-svc = { workspace = true, features = ["std"], default-features = false }

bitflags = { version = "2.11.1" }

async-stream = { version = "0.3.6" }
futures-util = { version = "0.3.32" }

strum = { version = "0.28", features = ["derive"] }

[build-dependencies]
embuild.workspace = true

[features]
default = ["esp32c6"]
coordinator = ["ezb-node-config/coordinator"]
router = ["ezb-node-config/router"]
#end_device_UNTESTED = [] #["ezb-node-config/end_device"]

touchlink = []

# Device types
_ep_all = ["ep_color_dimmable_light", "ep_color_dimmer_switch"]

ep_color_dimmable_light = ["ezb-node-config/color_dimmable_light"]
ep_color_dimmer_switch = ["ezb-node-config/color_dimmer_switch"]

# Device types on the other side (find, bind, access).
match_color_dimmable_light = []

esp32c6 = [
    "ezb-node-raw/esp32c6",
]

[lints]
workspace = true
