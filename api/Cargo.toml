[package]
name = "esp-zb"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"

[dependencies]
esp-zb-raw = { path = "../raw" }

log.workspace = true

embassy-executor = { version = "0.10.0" }
#embassy-futures = { version = "0.1.2" }
embassy-time = { workspace = true, features = ["log"] }

esp-idf-sys = { workspace = true, default-features = false }
    # just core

bitflags = { version = "2.11.1" }

#r [dev-dependencies]
#r esp-idf-sys = { workspace = true, features = ["alloc_handler", "binstart"], default-features = false }
#r    # just core

[build-dependencies]
embuild.workspace = true

[features]
default = ["esp32c6"]
controller = []
    # include features only needed for a Controller (in addition to EndDevice and Router capabilities)

touchlink = []
gp = []

# Endpoint types
ep_color_dimmable_light = []

esp32c6 = [
    "esp-zb-raw/esp32c6",
]

[lints]
workspace = true
